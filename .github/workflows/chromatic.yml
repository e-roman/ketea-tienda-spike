name: Chromatic

# Publica el Storybook en Chromatic en cada push a main (el estado se ve también en el commit).
# Requiere el secret CHROMATIC_PROJECT_TOKEN (GitHub → Settings → Secrets and variables → Actions → New repository secret).
# Sin el secret, el job se saltea la publicación y no falla.
on:
  push:
    branches: [main]

jobs:
  chromatic:
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Chromatic necesita el historial completo para comparar builds
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      # Los tokens de Ketea y Orali se instalan desde GitHub (el lockfile los resuelve por SSH): en el runner no hay clave SSH, así que se usa HTTPS.
      - name: Dependencias de GitHub por HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --legacy-peer-deps
      - name: Publicar en Chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        uses: chromaui/action@latest
        with:
          projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true # TurboSnap: solo recaptura las stories afectadas por el cambio
          exitOnceUploaded: true # no falla el CI por cambios visuales; se revisan en Chromatic
